name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Detekt static analysis
        run: ./gradlew detekt

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build Debug & Release APKs (ABI Splits)
        run: ./gradlew assembleDebug assembleRelease

      - name: Generate SHA256SUMS.txt
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ || true
          cp app/build/outputs/apk/release/*-release*.apk dist/ || true
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusfetch-android-apks
          path: dist/
